<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>拉美电商 AI 中台</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%231f8f5f'/%3E%3Ctext x='32' y='40' text-anchor='middle' font-family='Arial' font-size='22' font-weight='700' fill='white'%3ELA%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-mark">LA</div>
        <div>
          <div class="brand-title">拉美电商 AI 中台</div>
          <div class="brand-subtitle">运营 + 内容工厂 · Mexico / Brazil / Chile</div>
        </div>
      </div>

      <nav class="nav-block">
        <div class="nav-label">运营中心</div>
        <button class="nav-item active" data-view="dashboard"><span class="nav-icon">⌂</span>工作台</button>
        <button class="nav-item" data-view="radar"><span class="nav-icon">◈</span>选品雷达</button>
        <button class="nav-item" data-view="products"><span class="nav-icon">▤</span>商品中心 <span class="badge">6</span></button>
        <button class="nav-item" data-view="calendar"><span class="nav-icon">▦</span>内容日历</button>
        <button class="nav-item" data-view="orders"><span class="nav-icon">▣</span>订单物流</button>
        <button class="nav-item" data-view="analytics"><span class="nav-icon">▥</span>数据洞察</button>
      </nav>

      <div class="nav-block">
        <div class="nav-label">内容工厂</div>
        <button class="nav-item" data-view="factory"><span class="nav-icon">◇</span>生产工作台</button>
        <button class="nav-item" data-view="factory"><span class="nav-icon">▷</span>AI 视频工厂</button>
        <button class="nav-item" data-view="voice"><span class="nav-icon">♩</span>声音工厂</button>
        <button class="nav-item" data-view="rpa"><span class="nav-icon">□</span>RPA 上架</button>
      </div>

      <div class="nav-block">
        <div class="nav-label">系统</div>
        <button class="nav-item" data-view="settings"><span class="nav-icon">⚙</span>管理配置</button>
      </div>

      <div class="sidebar-footer">
        <div class="accent-card">
          <div class="accent-title">后端连接状态</div>
          <div class="accent-row"><span><i class="dot" id="engineDot"></i> API 引擎</span><strong id="engineStatus">演示数据</strong></div>
          <button class="connect-btn" data-action="settings">配置接口 →</button>
        </div>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="打开菜单">☰</button>
        <div>
          <div class="page-kicker">TikTok Shop · 拉美市场 · 运营控制台</div>
          <h1 class="page-title" id="pageHeading">工作台</h1>
        </div>
        <div class="topbar-tools">
          <input id="searchInput" class="search" placeholder="搜索商品、订单、视频任务..." />
          <div class="engine-list"><span><i class="dot"></i> Seedance</span><span><i class="dot"></i> LLM</span><span><i class="dot warn"></i> TTS</span><span><i class="dot warn"></i> RPA</span></div>
          <button class="lang-btn">ES / PT <span>🌎</span></button>
          <div class="avatar">A</div>
        </div>
      </header>

      <section id="app-view" class="content"></section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
